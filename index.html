<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบฟอร์มส่งงาน Netflix 4K</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Kanit', sans-serif; }
  </style>
</head>
<body class="bg-red-50 min-h-screen p-4 flex items-center justify-center">

  <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 border-2 border-red-200">
    <div class="text-center mb-5">
      <h1 class="text-2xl font-bold text-red-600">🐧 ฟอร์มส่งงาน Netflix 4K 🍿</h1>
      <p class="text-xs text-gray-500 mt-1">เลือกเมล ➔ เลือกจอ/PIN ➔ ออกฟอร์มซ้อนกันพร้อมติด #</p>
    </div>

    <!-- 1. เลือกประกัน (รับเคลม / ไม่รับเคลม) -->
    <div class="mb-4 bg-red-100 p-1.5 rounded-2xl flex gap-2">
      <button 
        type="button" 
        id="btnClaim" 
        onclick="setClaimType(true)" 
        class="flex-1 py-2 text-xs font-semibold rounded-xl transition duration-200 bg-red-500 text-white shadow-md"
      >
        🌸 มีประกัน (รับเคลม)
      </button>
      <button 
        type="button" 
        id="btnNoClaim" 
        onclick="setClaimType(false)" 
        class="flex-1 py-2 text-xs font-semibold rounded-xl transition duration-200 text-gray-600 hover:text-red-600"
      >
        🌷 ไม่มีประกัน (ไม่รับเคลม)
      </button>
    </div>

    <!-- 2. บันทึก/จัดการ คลังข้อมูลบัญชี -->
    <details class="mb-4 bg-amber-50 rounded-2xl border border-amber-200 p-3" id="storeDetails">
      <summary class="text-xs font-bold text-amber-700 cursor-pointer flex justify-between items-center">
        <span>💾 เพิ่ม/จัดการคลังข้อมูลบัญชี (Mail, Pass, PIN, จอ)</span>
        <span class="text-[10px] text-amber-500 font-normal">(กดเพื่อเปิด/ปิด)</span>
      </summary>
      
      <div class="mt-3 space-y-2 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-600 mb-0.5">Email บัญชี</label>
            <input type="email" id="storeEmail" placeholder="silopzea@gmail.com" class="w-full p-2 rounded-lg border border-amber-200 focus:outline-none bg-white">
          </div>
          <div>
            <label class="block text-gray-600 mb-0.5">Pass (รหัส)</label>
            <input type="text" id="storePass" placeholder="@AsDf22" class="w-full p-2 rounded-lg border border-amber-200 focus:outline-none bg-white">
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-600 mb-0.5">ชื่อจอ (Screen)</label>
            <input type="text" id="storeScreen" placeholder="เช่น L3" class="w-full p-2 rounded-lg border border-amber-200 text-center bg-white">
          </div>
          <div>
            <label class="block text-gray-600 mb-0.5">PIN จอ</label>
            <input type="text" id="storePin" placeholder="3333" class="w-full p-2 rounded-lg border border-amber-200 text-center bg-white">
          </div>
        </div>

        <div class="flex gap-2 pt-1">
          <button type="button" id="btnSaveStore" onclick="saveToStore()" class="flex-1 bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 rounded-xl transition shadow">
            💾 บันทึกเข้าคลัง
          </button>
          <button type="button" id="btnCancelEdit" onclick="cancelEditMode()" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-medium px-3 py-2 rounded-xl transition">
            ยกเลิก
          </button>
        </div>

        <!-- ปุ่มเปิด/ปิด ตารางรายการข้อมูลทั้งหมด -->
        <div class="pt-2 border-t border-amber-200/60 mt-2">
          <button type="button" onclick="toggleStoreTable()" class="w-full text-[11px] font-semibold text-amber-800 bg-amber-100 hover:bg-amber-200 py-1.5 rounded-lg transition flex items-center justify-center gap-1">
            ✏️ ดู / แก้ไข / ลบ รายการทั้งหมดในคลัง
          </button>
        </div>

        <!-- ตารางแสดงข้อมูลเพื่อกดแก้ไข/ลบ -->
        <div id="storeTableWrapper" class="hidden mt-2 max-h-48 overflow-y-auto border border-amber-200 rounded-lg bg-white p-2">
          <table class="w-full text-left text-[11px]">
            <thead>
              <tr class="border-b text-gray-500">
                <th class="pb-1">Email</th>
                <th class="pb-1">จอ</th>
                <th class="pb-1 text-center">PIN</th>
                <th class="pb-1 text-right">จัดการ</th>
              </tr>
            </thead>
            <tbody id="storeTableBody"></tbody>
          </table>
        </div>

      </div>
    </details>

    <form id="netflixForm" onsubmit="generateText(event)" class="space-y-4">
      
      <!-- 3. เลือกอุปกรณ์ และ ตัวเลือกวัน -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">เลือกอุปกรณ์</label>
          <div class="grid grid-cols-2 gap-1 bg-gray-100 p-1 rounded-xl">
            <label class="flex items-center justify-center py-1.5 text-xs font-medium rounded-lg cursor-pointer has-[:checked]:bg-white has-[:checked]:text-red-600 has-[:checked]:shadow-sm">
              <input type="radio" name="device" value="มือถือ" checked class="hidden"> 📱 มือถือ
            </label>
            <label class="flex items-center justify-center py-1.5 text-xs font-medium rounded-lg cursor-pointer has-[:checked]:bg-white has-[:checked]:text-red-600 has-[:checked]:shadow-sm">
              <input type="radio" name="device" value="ทีวี" class="hidden"> 📺 ทีวี
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">ระยะเวลา</label>
          <select id="daysSelect" onchange="calculateExpDate()" class="w-full px-3 py-1.5 text-xs rounded-xl border border-red-200 focus:outline-none focus:ring-2 focus:ring-red-400 bg-white">
            <option value="1">01 days (1 วัน)</option>
            <option value="2">02 days (2 วัน)</option>
            <option value="3">03 days (3 วัน)</option>
            <option value="4">04 days (4 วัน)</option>
            <option value="5">05 days (5 วัน)</option>
            <option value="6">06 days (6 วัน)</option>
            <option value="7">07 days (7 วัน)</option>
            <option value="8">08 days (8 วัน)</option>
            <option value="9">09 days (9 วัน)</option>
            <option value="10">10 days (10 วัน)</option>
            <option value="30">30 days (30 วัน)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">วันหมดอายุ (คำนวณอัตโนมัติ ตัด 22.00 น.)</label>
        <input type="text" id="expDate" readonly class="w-full px-3 py-1.5 text-xs font-semibold text-center rounded-xl border border-gray-200 bg-gray-100 text-gray-700">
      </div>

      <!-- 4. ส่วนกล่องฟอร์มกรอกทีละตัว -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-medium text-gray-700">รายการฟอร์มที่ต้องการส่ง:</label>
          <button type="button" onclick="addFormBlock()" class="text-xs bg-red-500 hover:bg-red-600 text-white font-semibold px-3 py-1 rounded-xl shadow transition">
            ➕ เพิ่มฟอร์มถัดไป
          </button>
        </div>

        <div id="formBlocksContainer" class="space-y-3"></div>
      </div>

      <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-medium py-3 rounded-xl transition text-sm shadow-md mt-2">
        ✨ สร้างข้อความรวม และคัดลอก
      </button>

    </form>

    <!-- พรีวิวข้อความ -->
    <div class="mt-6">
      <label class="block text-xs font-medium text-gray-500 mb-1">ตัวอย่างข้อความที่คัดลอกได้:</label>
      <textarea id="output" rows="22" readonly class="w-full p-3 text-xs bg-slate-50 border border-gray-200 rounded-xl font-mono whitespace-pre text-gray-700 focus:outline-none"></textarea>
    </div>
  </div>

  <script>
    const defaultStore = [
      { email: 'silopzea@gmail.com', pass: '@AsDf22', pin: '3333', screen: 'L3' },
      { email: 'silopzea@gmail.com', pass: '@AsDf22', pin: '4444', screen: 'L4' },
      { email: 'smnuuooaaq@gmail.com', pass: '@SUMNH', pin: '2222', screen: 'S2' }
    ];

    let accountStore = [];
    let isClaimable = false;
    let blockCounter = 0;
    let editingIndex = -1; // ดัชนีของรายการที่กำลังแก้ไข (-1 = โหมดเพิ่มปกติ)

    function initStore() {
      const saved = localStorage.getItem('netflix_master_store_v2');
      if (saved) {
        accountStore = JSON.parse(saved);
      } else {
        accountStore = [...defaultStore];
        saveStoreToLocal();
      }
      
      document.getElementById('formBlocksContainer').innerHTML = '';
      blockCounter = 0;
      addFormBlock();
      setClaimType(false);
      renderStoreTable();
    }

    function saveStoreToLocal() {
      localStorage.setItem('netflix_master_store_v2', JSON.stringify(accountStore));
    }

    function refreshDropdowns() {
      const uniqueEmails = [...new Set(accountStore.map(acc => acc.email))];
      document.querySelectorAll('[id^="select-email-"]').forEach(select => {
        const currentVal = select.value;
        select.innerHTML = '<option value="">-- 1. เลือก Email --</option>';
        uniqueEmails.forEach(e => {
          const opt = document.createElement('option');
          opt.value = e;
          opt.textContent = e;
          select.appendChild(opt);
        });
        select.value = currentVal;
      });
    }

    function addFormBlock() {
      blockCounter++;
      const id = blockCounter;
      const container = document.getElementById('formBlocksContainer');
      const currentCount = container.children.length + 1;
      const isSecondary = currentCount > 1;

      const blockDiv = document.createElement('div');
      blockDiv.id = `form-block-${id}`;
      blockDiv.className = "p-3 bg-red-50/70 rounded-2xl border border-red-200 space-y-2 relative";

      const uniqueEmails = [...new Set(accountStore.map(acc => acc.email))];
      let emailOptionsHtml = '<option value="">-- 1. เลือก Email --</option>';
      uniqueEmails.forEach(email => {
        emailOptionsHtml += `<option value="${email}">${email}</option>`;
      });

      blockDiv.innerHTML = `
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-red-600 flex items-center gap-1">
            📌 ฟอร์มที่ ${currentCount} ${isSecondary ? '<span class="text-[10px] text-amber-600 bg-amber-100 px-1.5 py-0.5 rounded-full">(ใส่ # หน้า 🐧♡ อัตโนมัติ)</span>' : ''}
          </span>
          ${isSecondary ? `<button type="button" onclick="removeFormBlock(${id})" class="text-[10px] text-red-400 hover:text-red-600 font-semibold">❌ ลบฟอร์มนี้</button>` : ''}
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-gray-500 mb-0.5">เลือก Email บัญชี</label>
            <select id="select-email-${id}" onchange="onEmailChange(${id})" class="w-full px-2 py-1.5 text-xs rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-1 focus:ring-red-400">
              ${emailOptionsHtml}
            </select>
          </div>
          <div>
            <label class="block text-[10px] text-gray-500 mb-0.5">เลือก จอ / PIN</label>
            <select id="select-slot-${id}" onchange="onSlotChange(${id})" class="w-full px-2 py-1.5 text-xs rounded-lg border border-gray-200 bg-white focus:outline-none focus:ring-1 focus:ring-red-400" disabled>
              <option value="">-- เลือก Email ก่อน --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2 pt-1">
          <div>
            <label class="block text-[10px] text-gray-400">Pass</label>
            <input type="text" id="pass-${id}" readonly class="w-full px-2 py-1 text-xs rounded border border-gray-200 bg-gray-50 text-gray-600">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400">PIN</label>
            <input type="text" id="pin-${id}" readonly class="w-full px-2 py-1 text-xs rounded border border-gray-200 bg-gray-50 text-center text-gray-600">
          </div>
          <div>
            <label class="block text-[10px] text-gray-400">Screen</label>
            <input type="text" id="screen-${id}" readonly class="w-full px-2 py-1 text-xs rounded border border-gray-200 bg-gray-50 text-center text-gray-600">
          </div>
        </div>
      `;

      container.appendChild(blockDiv);
    }

    function onEmailChange(id) {
      const emailSelect = document.getElementById(`select-email-${id}`);
      const slotSelect = document.getElementById(`select-slot-${id}`);
      const selectedEmail = emailSelect.value;

      slotSelect.innerHTML = '<option value="">-- เลือก จอ/PIN --</option>';
      document.getElementById(`pass-${id}`).value = '';
      document.getElementById(`pin-${id}`).value = '';
      document.getElementById(`screen-${id}`).value = '';

      if (!selectedEmail) {
        slotSelect.disabled = true;
        return;
      }

      const matchedSlots = accountStore.filter(acc => acc.email === selectedEmail);
      matchedSlots.forEach((acc) => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify(acc);
        opt.textContent = `จอ: ${acc.screen} | PIN: ${acc.pin}`;
        slotSelect.appendChild(opt);
      });

      slotSelect.disabled = false;
    }

    function onSlotChange(id) {
      const slotSelect = document.getElementById(`select-slot-${id}`);
      if (!slotSelect.value) return;

      const acc = JSON.parse(slotSelect.value);
      document.getElementById(`pass-${id}`).value = acc.pass || '';
      document.getElementById(`pin-${id}`).value = acc.pin || '';
      document.getElementById(`screen-${id}`).value = acc.screen || '';
    }

    function removeFormBlock(id) {
      const block = document.getElementById(`form-block-${id}`);
      if (block) block.remove();
      reindexFormTitles();
    }

    function reindexFormTitles() {
      const blocks = document.getElementById('formBlocksContainer').children;
      for (let i = 0; i < blocks.length; i++) {
        const titleSpan = blocks[i].querySelector('span');
        const isSecondary = i > 0;
        titleSpan.innerHTML = `📌 ฟอร์มที่ ${i + 1} ${isSecondary ? '<span class="text-[10px] text-amber-600 bg-amber-100 px-1.5 py-0.5 rounded-full">(ใส่ # หน้า 🐧♡ อัตโนมัติ)</span>' : ''}`;
      }
    }

    // ระบบบันทึก / แก้ไข ข้อมูลในคลัง
    function saveToStore() {
      const email = document.getElementById('storeEmail').value.trim();
      const pass = document.getElementById('storePass').value.trim();
      const pin = document.getElementById('storePin').value.trim();
      const screen = document.getElementById('storeScreen').value.trim();

      if (!email || !screen || !pin) {
        alert('กรุณากรอก Email, ชื่อจอ และ PIN ให้ครบนะคะ');
        return;
      }

      if (editingIndex >= 0) {
        // โหมดแก้ไขรายการเดิม
        accountStore[editingIndex] = { email, pass, pin, screen };
        alert('แก้ไขข้อมูลในคลังเรียบร้อยแล้ว!');
      } else {
        // โหมดเพิ่มรายการใหม่
        accountStore.push({ email, pass, pin, screen });
        alert('บันทึกเข้าคลังเรียบร้อยแล้ว!');
      }

      saveStoreToLocal();
      refreshDropdowns();
      renderStoreTable();
      cancelEditMode();
    }

    // แสดงตารางจัดการข้อมูลคลัง
    function toggleStoreTable() {
      const wrapper = document.getElementById('storeTableWrapper');
      wrapper.classList.toggle('hidden');
    }

    function renderStoreTable() {
      const tbody = document.getElementById('storeTableBody');
      tbody.innerHTML = '';

      if (accountStore.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="text-center py-2 text-gray-400">ไม่มีข้อมูลในคลัง</td></tr>';
        return;
      }

      accountStore.forEach((acc, idx) => {
        const tr = document.createElement('tr');
        tr.className = "border-b border-gray-100 text-gray-700 hover:bg-amber-50/50";
        tr.innerHTML = `
          <td class="py-1.5 truncate max-w-[120px]">${acc.email}</td>
          <td class="py-1.5 font-medium">${acc.screen}</td>
          <td class="py-1.5 text-center">${acc.pin}</td>
          <td class="py-1.5 text-right space-x-1">
            <button type="button" onclick="editStoreItem(${idx})" class="text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-800 px-1.5 py-0.5 rounded font-medium">แก้ไข</button>
            <button type="button" onclick="deleteStoreItem(${idx})" class="text-[10px] bg-red-100 hover:bg-red-200 text-red-600 px-1.5 py-0.5 rounded font-medium">ลบ</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function editStoreItem(index) {
      editingIndex = index;
      const item = accountStore[index];

      document.getElementById('storeEmail').value = item.email;
      document.getElementById('storePass').value = item.pass || '';
      document.getElementById('storeScreen').value = item.screen;
      document.getElementById('storePin').value = item.pin;

      const btnSave = document.getElementById('btnSaveStore');
      btnSave.textContent = '💾 บันทึกการแก้ไข';
      btnSave.className = "flex-1 bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 rounded-xl transition shadow";
      document.getElementById('btnCancelEdit').classList.remove('hidden');

      // เลื่อนโฟกัสกลับขึ้นไปที่ฟอร์มแก้ไข
      document.getElementById('storeEmail').focus();
    }

    function cancelEditMode() {
      editingIndex = -1;
      document.getElementById('storeEmail').value = '';
      document.getElementById('storePass').value = '';
      document.getElementById('storeScreen').value = '';
      document.getElementById('storePin').value = '';

      const btnSave = document.getElementById('btnSaveStore');
      btnSave.textContent = '💾 บันทึกเข้าคลัง';
      btnSave.className = "flex-1 bg-amber-500 hover:bg-amber-600 text-white font-medium py-2 rounded-xl transition shadow";
      document.getElementById('btnCancelEdit').classList.add('hidden');
    }

    function deleteStoreItem(index) {
      if (confirm(`ต้องการลบรายการ ${accountStore[index].email} (จอ ${accountStore[index].screen}) ออกจากคลังใช่ไหม?`)) {
        accountStore.splice(index, 1);
        saveStoreToLocal();
        refreshDropdowns();
        renderStoreTable();
        if (editingIndex === index) cancelEditMode();
      }
    }

    function setClaimType(status) {
      isClaimable = status;
      const btnClaim = document.getElementById('btnClaim');
      const btnNoClaim = document.getElementById('btnNoClaim');

      if (status) {
        btnClaim.className = "flex-1 py-2 text-xs font-semibold rounded-xl transition duration-200 bg-red-500 text-white shadow-md";
        btnNoClaim.className = "flex-1 py-2 text-xs font-semibold rounded-xl transition duration-200 text-gray-600 hover:text-red-600";
      } else {
        btnNoClaim.className = "flex-1 py-2 text-xs font-semibold rounded-xl transition duration-200 bg-red-500 text-white shadow-md";
        btnClaim.className = "flex-1 py-2 text-xs font-semibold rounded-xl transition duration-200 text-gray-600 hover:text-red-600";
      }
    }

    function calculateExpDate() {
      const daysAdd = parseInt(document.getElementById('daysSelect').value);
      const targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + daysAdd);

      const day = String(targetDate.getDate()).padStart(2, '0');
      const month = String(targetDate.getMonth() + 1).padStart(2, '0');

      document.getElementById('expDate').value = `${day}  ${month} - 22.00`;
    }

    function generateText(event) {
      event.preventDefault();

      const device = document.querySelector('input[name="device"]:checked').value;
      const daysVal = document.getElementById('daysSelect').value;
      const daysText = String(daysVal).padStart(2, '0') + " days";
      const expDate = document.getElementById('expDate').value;

      const claimText = isClaimable 
        ? `    🌸 ” มีประกัน รับเคลมตามเงื่อนไขร้าน “ `
        : `    🌷 ” เมลโดนปิดไม่รับเคลม “ `;

      const blocks = document.getElementById('formBlocksContainer').children;
      let fullOutput = [];

      for (let i = 0; i < blocks.length; i++) {
        const block = blocks[i];
        const emailSelect = block.querySelector('[id^="select-email-"]');
        const email = emailSelect.value;
        const pass = block.querySelector('.grid input[id^="pass-"]').value;
        const pin = block.querySelector('.grid input[id^="pin-"]').value;
        const screen = block.querySelector('.grid input[id^="screen-"]').value;

        if (!email || !pin) continue;

        const headerPrefix = (i === 0) ? "" : "#";

        const singleFormTemplate = `${headerPrefix}🐧♡     netflix 4k  ${daysText}  ❨ ${device}❩ ㅉ
                  exp 𓈒 ${expDate} 🍊

    mail 𓈒${email}
    Pass  𓈒${pass}
                         pin         screen 
                       ${pin}          ${screen}
          ᡗ𓏽 . . 𓏽つ
    กรุณาอ่านกฎก่อน𓈒เข้าใช้
 ୨୧ ｡        ผิดกฎปรับ 500 บาททุกกรณี ‼️

         𓏴 💘 ห้ามเปลี่ยนเมลพาส
       หรือการตั้งค่าใด ๆ ทั้งสิ้น 𓏴

          ☆   1 จอ ต่อ 1 อุปกรณ์ 🖱️
      ย้ายเครื่องออกอันเดิมก่อน ☆

     𓈒 ィ  หากจอชนรอ 20 - 60 นาที
        จอหารงดโวยวายนะคะ 🐬

    𓈒⠀❤︎  หากแอคมี𓈒ปัญหารบกวน
    แจ้งร้าน งดแก้ไขปัญหาเอง🪄

${claimText}

𓈒   รับชมให้สนุกนะคะ 🐠
แอคมีปัญหาทักได้เลยค่ะ      ♡ 𓈒`;

        fullOutput.push(singleFormTemplate);
      }

      if (fullOutput.length === 0) {
        alert('กรุณาเลือก Email และ จอ/PIN อย่างน้อย 1 ฟอร์มก่อนกดคัดลอกนะคะ');
        return;
      }

      const finalText = fullOutput.join("\n\n");
      const outputTextarea = document.getElementById('output');
      outputTextarea.value = finalText;

      navigator.clipboard.writeText(finalText).then(() => {
        alert('คัดลอกข้อความเรียบร้อยแล้ว!');
      }).catch(() => {
        alert('สร้างข้อความสำเร็จแล้ว (คัดลอกจากช่องด้านล่างได้เลย)');
      });
    }

    initStore();
    calculateExpDate();
  </script>

</body>
</html>
